name: Build Native PWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/pwa-android/**'
      - '.github/workflows/build-pwa-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: 📱 Compile VyaparBook APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 🔑 Make Gradlew Executable
        run: |
          sed -i 's/\r$//' apps/pwa-android/gradlew
          chmod +x apps/pwa-android/gradlew

      - name: 📝 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🏗️ Build Native APK
        working-directory: apps/pwa-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Verify and Prepare APK File
        run: |
          ls -la apps/pwa-android/app/build/outputs/apk/release/
          test -f apps/pwa-android/app/build/outputs/apk/release/app-release.apk
          cp apps/pwa-android/app/build/outputs/apk/release/app-release.apk VyaparBook.apk
          echo "✅ Successfully created VyaparBook.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparBook-Android-APK
          path: VyaparBook.apk
          if-no-files-found: error

      - name: 🚀 Publish to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "VyaparBook Mobile APK (Latest Release)"
          body: |
            ### 📱 VyaparBook Android App (Official Release)
            - **App Version:** 1.0.0
            - **Package:** `in.vyaparbook.app`
            - **Size:** Lightweight (~2.5 MB)
            - **Features:** High-speed WebView, Camera & Gallery Bill Scanner, Swipe-to-refresh, Offline Cache, Instant Live Sync with Desktop & Web.
          files: |
            VyaparBook.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
