name: Build Native PWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: 📱 Compile VyaparBook APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Make Gradlew Executable
        run: |
          sed -i 's/\r$//' apps/pwa-android/gradlew
          chmod +x apps/pwa-android/gradlew

      - name: 🏗️ Build Native APK
        working-directory: apps/pwa-android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Verify and Prepare APK File
        run: |
          ls -la apps/pwa-android/app/build/outputs/apk/release/
          test -f apps/pwa-android/app/build/outputs/apk/release/app-release.apk
          mkdir -p apps/web/public/downloads
          cp apps/pwa-android/app/build/outputs/apk/release/app-release.apk apps/web/public/downloads/vyaparbook-mobile.apk
          echo "✅ Successfully copied APK to web downloads directory!"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparBook-Mobile-APK
          path: apps/pwa-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 🚀 Publish to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "VyaparBook Mobile APK (Latest Release)"
          body: "Official VyaparBook Android App APK. Fast, lightweight (~2MB), with smart multi-page PDF bill recognition."
          files: apps/pwa-android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌐 Push APK into Web Downloads for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apps/web/public/downloads/vyaparbook-mobile.apk
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(download): update vyaparbook-mobile.apk binary in web public downloads [skip ci]"
            git push origin main || echo "Push skipped or branch protected"
          fi
