name: Build Native PWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/pwa-android/**'
      - '.github/workflows/build-pwa-apk.yml'

jobs:
  build:
    name: 📱 Compile VyaparBook APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 🔑 Make Gradlew Executable
        run: chmod +x apps/pwa-android/gradlew

      - name: 🏗️ Build Native APK
        working-directory: apps/pwa-android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📁 Verify APK Generation
        run: |
          ls -la apps/pwa-android/app/build/outputs/apk/release/
          test -f apps/pwa-android/app/build/outputs/apk/release/app-release.apk
          cp apps/pwa-android/app/build/outputs/apk/release/app-release.apk apps/web/public/downloads/vyaparbook-mobile.apk
          echo "✅ Successfully copied APK to web downloads directory!"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparBook-Mobile-APK
          path: apps/pwa-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 🚀 Commit APK to Web Downloads for Direct Link
        run: |
          git config user.name "VyaparBook CI Bot"
          git config user.email "bot@vyaparbook.in"
          git add apps/web/public/downloads/vyaparbook-mobile.apk
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(download): update real vyaparbook-mobile.apk in web public downloads"
            git push origin main
          fi
