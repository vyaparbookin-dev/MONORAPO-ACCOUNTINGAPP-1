name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 🪟 Compile Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install root dependencies
        run: npm install --legacy-peer-deps

      - name: 📦 Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Assets
        working-directory: apps/desktop
        run: npx vite build

      - name: 📦 Package Electron Windows Installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -c.publish=never

      - name: 📤 Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Red-Accounting-Book-Windows-Installer
          path: |
            apps/desktop/dist_electron/*.exe
            apps/desktop/dist_electron/latest.yml
          if-no-files-found: warn

      - name: 🚀 Release Windows App to GitHub (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist_electron/*.exe
            apps/desktop/dist_electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
