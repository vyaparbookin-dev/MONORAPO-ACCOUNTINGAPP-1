name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: 🤖 Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install root dependencies
        run: npm install --legacy-peer-deps

      - name: 📦 Install mobile workspace dependencies
        run: npm install --legacy-peer-deps --workspace=apps/mobile

      - name: 🔑 Make Gradlew Executable
        run: chmod +x apps/mobile/android/gradlew

      - name: 🏗️ Build Android APK (Debug & Release)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📤 Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Red-Accounting-Book-Mobile-APK
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk

      - name: 🚀 Release to GitHub (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
