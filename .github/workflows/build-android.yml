name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci || npm install

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make Gradlew Executable
        run: chmod +x apps/mobile/android/gradlew

      - name: 🏗️ Build Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Red-Accounting-Book-Mobile-APK
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: 🚀 Release to GitHub (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
