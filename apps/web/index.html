<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VyaparBook" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob: wss:;" />
    <title>VyaparBook 2.0 - Billing & Mobile Accounting</title>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A]">
    <div id="root"></div>
    <script>
      // Global Dynamic Import / Chunk Failure Auto-Reload Protection
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('⚡ [Vite Chunk Sync] New application version detected, reloading latest assets...');
        window.location.reload();
      });
      window.addEventListener('error', (e) => {
        if (e && (e.message?.includes('Failed to fetch dynamically imported module') || e.message?.includes('Expected a JavaScript-or-Wasm module script') || e.message?.includes('text/html'))) {
          const reloadKey = 'vb_chunk_reload_' + (window.location.pathname || 'root');
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            console.warn('⚡ [Chunk Recovery] Stale chunk MIME mismatch detected, refreshing now...');
            window.location.reload();
          }
        }
      });
    </script>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              console.log('✅ PWA Active:', reg.scope);
            })
            .catch(err => console.log('SW Registration error:', err));
        });
      }
    </script>
  </body>
</html>
