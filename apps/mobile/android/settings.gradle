pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }

  def monorepoRoot = settingsDir.getParentFile().getParentFile().getParentFile()
  def pluginDir = new File(monorepoRoot, "node_modules/@react-native/gradle-plugin")
  if (!pluginDir.exists()) {
    pluginDir = new File(settingsDir.getParentFile(), "node_modules/@react-native/gradle-plugin")
  }
  includeBuild(pluginDir)
}

rootProject.name = 'mobile-inventory-app'

def monorepoRoot = settingsDir.getParentFile().getParentFile().getParentFile()
def autolinkingScript = new File(monorepoRoot, "node_modules/expo/scripts/autolinking.gradle")
if (!autolinkingScript.exists()) {
  autolinkingScript = new File(settingsDir.getParentFile(), "node_modules/expo/scripts/autolinking.gradle")
}
apply from: autolinkingScript
useExpoModules()

include ':app'
