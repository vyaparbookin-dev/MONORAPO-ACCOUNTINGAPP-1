pluginManagement {
  def getPluginPath = { String relativePathRoot, String relativePathLocal ->
    def fRoot = new File(settingsDir, relativePathRoot)
    if (fRoot.exists()) return fRoot.absolutePath
    def fLocal = new File(settingsDir, relativePathLocal)
    if (fLocal.exists()) return fLocal.absolutePath
    return fRoot.absolutePath
  }

  def reactNativeGradlePlugin = getPluginPath("../../node_modules/@react-native/gradle-plugin", "../node_modules/@react-native/gradle-plugin")
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = getPluginPath("../../node_modules/expo-modules-core/android/expo-gradle-plugin", "../node_modules/expo-modules-core/android/expo-gradle-plugin")
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'mobile-inventory-app'

expoAutolinking.useExpoVersionCatalog()

include ':app'
