pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }

  def pluginDir = new File(settingsDir, "../../../node_modules/@react-native/gradle-plugin")
  if (!pluginDir.exists()) {
    pluginDir = new File(settingsDir, "../node_modules/@react-native/gradle-plugin")
  }
  includeBuild(pluginDir)
}

rootProject.name = 'mobile-inventory-app'

def autolinkingScript = new File(settingsDir, "../../../node_modules/expo/scripts/autolinking.gradle")
if (!autolinkingScript.exists()) {
  autolinkingScript = new File(settingsDir, "../node_modules/expo/scripts/autolinking.gradle")
}
apply from: autolinkingScript
useExpoModules()

include ':app'
