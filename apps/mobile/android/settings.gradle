pluginManagement {
  def getPluginPath = { String pluginSubpath ->
    // 1. Check in apps/mobile/node_modules (1 level up from android)
    def p1 = new File(settingsDir, "../node_modules/" + pluginSubpath)
    if (p1.exists()) return p1.absolutePath

    // 2. Check in root monorepo node_modules (3 levels up: android -> mobile -> apps -> root)
    def p2 = new File(settingsDir, "../../../node_modules/" + pluginSubpath)
    if (p2.exists()) return p2.absolutePath

    // 3. Fallback 2 levels up
    def p3 = new File(settingsDir, "../../node_modules/" + pluginSubpath)
    if (p3.exists()) return p3.absolutePath

    return p2.absolutePath
  }

  def reactNativeGradlePlugin = getPluginPath("@react-native/gradle-plugin")
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = getPluginPath("expo-modules-core/android/expo-gradle-plugin")
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'mobile-inventory-app'

expoAutolinking.useExpoVersionCatalog()

include ':app'
